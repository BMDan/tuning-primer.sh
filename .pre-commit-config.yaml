---
files: (?x)^(.*\.(php|py|pl|pm|json|md|sh|yaml|cfg|txt)|[^/]* )$
exclude: (?x)^((LICENCE$))
repos:
  - repo: local
    hooks:
      - id: check-bash-syntax
        name: Check Shell scripts syntax correctness
        language: system
        entry: bash -n
        files: \.sh$
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: a30f0d816e5062a67d87c8de753cfe499672b959
    hooks:
      - id: remove-tabs
  - repo: https://github.com/lovesegfault/beautysh.git
    rev: e5f49f023ed8a62696555bd7c06b90355f083d2d
    hooks:
      - id: beautysh
        args: [--indent-size,"2"]
        additional_dependencies: [setuptools]
  - repo: https://github.com/executablebooks/mdformat
    rev: 2d496dbc18e31b83a1596685347ffe0b6041daf0
    hooks:
      - id: mdformat
        name: Format Markdown
        entry: mdformat  # Executable to run, with fixed options
        language: python
        stages: [manual]
        types: [markdown]
        args: [--wrap, '75', --number]
        additional_dependencies: [mdformat-toc, mdformat-gfm]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c
    hooks:
      - id: no-commit-to-branch
        args: [--branch, dummy]
      - id: check-yaml
        args: [--unsafe]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: fix-byte-order-marker
      - id: check-case-conflict
  - repo: https://github.com/adrienverge/yamllint.git
    rev: 79a6b2b1392eaf49cdd32ac4f14be1a809bbd8f7
    hooks:
      - id: yamllint
        args:
          - --no-warnings
          - -d
          - '{extends: relaxed, rules: {line-length: {max: 120}}}'
  - repo: https://github.com/codespell-project/codespell
    rev: 63c8f8312b7559622c0d82815639671ae42132ac
    hooks:
      - id: codespell
        exclude: (LICENSE)$
        # args: [--toml, pyproject.toml]
        # additional_dependencies:
        #  - tomli
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95
    hooks:
      - id: shellcheck
        files: ^[^\.].*\.sh$
        # Change the entry to make this work on cygwin
        args:
          - -x
          - -e
          - SC2012
          - -e
          - SC2154
          - -e
          - SC2155
          - -e
          - SC2162
